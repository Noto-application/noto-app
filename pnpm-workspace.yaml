packages:
  - 'apps/*'
  - 'packages/*'
# unrs-resolver собирает нативный биндинг резолвера для ESLint.
# prisma/@prisma/engines качают нативные query-движки при установке.
# esbuild ставит платформенный бинарник — нужен Vite, на котором работает Storybook.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # sharp ставится prebuilt-бинарниками (@img/sharp-*), build-скрипт не нужен.
  sharp: false
  unrs-resolver: true
