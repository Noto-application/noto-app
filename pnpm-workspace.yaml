packages:
  - 'apps/*'
  - 'packages/*'
# unrs-resolver собирает нативный биндинг резолвера для ESLint.
# prisma/@prisma/engines качают нативные query-движки при установке.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: set this to true or false
  unrs-resolver: true
