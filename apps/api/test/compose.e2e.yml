# Отдельный Compose project на каждый запуск; рабочие volumes не подключаются.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noto
      POSTGRES_PASSWORD: noto
      POSTGRES_DB: noto_e2e
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U noto -d noto_e2e']
      interval: 1s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 30
